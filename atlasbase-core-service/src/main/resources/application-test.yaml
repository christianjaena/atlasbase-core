spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialiect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

logging:
  level:
    root: DEBUG
    org.springframework.web: DEBUG
    com.atlasbase: DEBUG

liquibase:
  enabled: true
  change-log: classpath:db/changelog/db.changelog-master.yaml
  default-schema: public
  clear-checksums: true
  drop-first: true