spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/atlasbasedb
    username: atlasbase_admin
    password: atlasbase_admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: local
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
